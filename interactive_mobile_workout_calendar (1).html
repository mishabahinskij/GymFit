<!DOCTYPE html>
<html lang="uk" class="dark h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>GymFit Mobile PWA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                            accent: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* Glassmorphism background */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Safe area support for iOS notches & home indicators */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 12px);
        }

        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Slide Animation classes */
        .slide-left {
            animation: slideLeft 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .slide-right {
            animation: slideRight 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideLeft {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideRight {
            from { transform: translateX(-30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Pulse glow for active timer */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.8); }
        }
        .timer-active {
            animation: pulseGlow 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col overflow-hidden">

    <!-- Top Mobile Header -->
    <header class="pt-safe bg-slate-900/90 border-b border-slate-800/80 px-4 py-3 flex items-center justify-between sticky top-0 z-30 backdrop-blur-md">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-lg shadow-lg shadow-emerald-500/20">
                <i class="fa-solid font-black fa-dumbbell"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base tracking-tight text-white leading-none">GymFit <span class="text-xs font-semibold px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 ml-1">PRO</span></h1>
                <p id="header-date" class="text-[11px] text-slate-400 font-medium mt-0.5">Щотиневий розклад</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Reset Day Progress Button -->
            <button onclick="resetCurrentDayProgress()" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 text-slate-300 flex items-center justify-center active:scale-95 transition" title="Скинути прогрес дня">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
            <!-- Rest Timer Toggle Button -->
            <button onclick="openTimerModal()" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/60 text-emerald-400 flex items-center justify-center active:scale-95 transition relative">
                <i class="fa-solid fa-stopwatch text-sm"></i>
                <span id="timer-badge" class="hidden absolute -top-1 -right-1 w-3 h-3 bg-emerald-500 rounded-full ring-2 ring-slate-900"></span>
            </button>
        </div>
    </header>

    <!-- Day Selector Strip -->
    <div class="bg-slate-900/60 border-b border-slate-800/60 px-2 py-2 overflow-x-auto no-scrollbar">
        <div class="flex gap-1.5 min-w-max justify-between max-w-md mx-auto">
            <button onclick="changeDay(0)" id="day-btn-0" class="day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] transition-all">
                <span class="text-[10px] font-bold tracking-wider uppercase text-slate-400">Пн</span>
                <span class="text-xs mt-0.5">🟢</span>
            </button>
            <button onclick="changeDay(1)" id="day-btn-1" class="day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] transition-all">
                <span class="text-[10px] font-bold tracking-wider uppercase text-slate-400">Вт</span>
                <span class="text-xs mt-0.5">🏋️</span>
            </button>
            <button onclick="changeDay(2)" id="day-btn-2" class="day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] transition-all">
                <span class="text-[10px] font-bold tracking-wider uppercase text-slate-400">Ср</span>
                <span class="text-xs mt-0.5">🏊</span>
            </button>
            <button onclick="changeDay(3)" id="day-btn-3" class="day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] transition-all">
                <span class="text-[10px] font-bold tracking-wider uppercase text-slate-400">Чт</span>
                <span class="text-xs mt-0.5">🏋️</span>
            </button>
            <button onclick="changeDay(4)" id="day-btn-4" class="day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] transition-all">
                <span class="text-[10px] font-bold tracking-wider uppercase text-slate-400">Пт</span>
                <span class="text-xs mt-0.5">🏊</span>
            </button>
            <button onclick="changeDay(5)" id="day-btn-5" class="day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] transition-all">
                <span class="text-[10px] font-bold tracking-wider uppercase text-slate-400">Сб</span>
                <span class="text-xs mt-0.5">🟢</span>
            </button>
            <button onclick="changeDay(6)" id="day-btn-6" class="day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] transition-all">
                <span class="text-[10px] font-bold tracking-wider uppercase text-slate-400">Нд</span>
                <span class="text-xs mt-0.5">🟢</span>
            </button>
        </div>
    </div>

    <!-- Main Interactive Swipe Container -->
    <main id="touch-container" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar max-w-md mx-auto w-full relative">
        
        <!-- Progress Bar Card -->
        <div class="glass-card rounded-2xl p-4 shadow-lg border border-slate-800">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-2">
                    <span id="day-type-badge" class="text-xs font-extrabold px-2.5 py-1 rounded-lg uppercase tracking-wide">
                        --
                    </span>
                    <h2 id="day-title" class="text-lg font-bold text-white">--</h2>
                </div>
                <span id="progress-text" class="text-xs font-bold text-slate-400">0%</span>
            </div>
            
            <p id="day-subtitle" class="text-xs text-slate-400 mb-3">--</p>
            
            <!-- Progress Track -->
            <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 rounded-full transition-all duration-500 w-0"></div>
            </div>
        </div>

        <!-- Exercises List Panel -->
        <div id="workout-card-container" class="space-y-3 pb-24">
            <!-- Dynamic Exercises will be injected here -->
        </div>

    </main>

    <!-- Floating Active Rest Timer Overlay Bar -->
    <div id="active-timer-bar" class="hidden fixed bottom-20 left-4 right-4 max-w-md mx-auto z-40 bg-slate-900/95 border border-emerald-500/50 rounded-2xl p-3 shadow-2xl flex items-center justify-between backdrop-blur-md timer-active">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg font-black">
                <i class="fa-solid fa-stopwatch animate-pulse"></i>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Відпочинок між підходами</div>
                <div id="active-timer-countdown" class="text-xl font-black text-white font-mono">00:00</div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="addTimerTime(30)" class="px-2.5 py-1.5 bg-slate-800 border border-slate-700 text-xs text-emerald-400 font-bold rounded-lg active:scale-95">+30с</button>
            <button onclick="stopTimer()" class="w-8 h-8 bg-red-500/20 border border-red-500/40 text-red-400 rounded-lg flex items-center justify-center active:scale-95">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Rest Timer Control Modal -->
    <div id="timer-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
        <div class="glass-card bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl animate-in fade-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-stopwatch text-emerald-400"></i> Таймер відпочинку
                </h3>
                <button onclick="closeTimerModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <p class="text-xs text-slate-400 mb-4">Оберіть час відпочинку між підходами:</p>
            <div class="grid grid-cols-4 gap-2 mb-4">
                <button onclick="startTimer(30)" class="py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-emerald-400 font-bold text-sm active:scale-95">30 с</button>
                <button onclick="startTimer(60)" class="py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-emerald-400 font-bold text-sm active:scale-95">60 с</button>
                <button onclick="startTimer(90)" class="py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-emerald-400 font-bold text-sm active:scale-95">90 с</button>
                <button onclick="startTimer(120)" class="py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-emerald-400 font-bold text-sm active:scale-95">120 с</button>
            </div>
        </div>
    </div>

    <!-- Weight/Rep Edit Modal -->
    <div id="weight-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
        <div class="glass-card bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="weight-modal-title" class="text-sm font-bold text-white">Запис ваги та повторень</h3>
                <button onclick="closeWeightModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            
            <div class="space-y-3 mb-5">
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Вага (кг)</label>
                    <input type="number" id="input-weight" placeholder="напр. 65" step="0.5" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-bold focus:outline-none focus:border-emerald-500 text-base">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Повторення</label>
                    <input type="number" id="input-reps" placeholder="напр. 10" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-bold focus:outline-none focus:border-emerald-500 text-base">
                </div>
            </div>

            <button onclick="saveWeightReps()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-emerald-600 rounded-xl font-bold text-slate-950 text-sm shadow-lg shadow-emerald-500/20 active:scale-95">
                Зберегти результати
            </button>
        </div>
    </div>

    <!-- Bottom PWA Navigation Bar -->
    <nav class="glass-nav fixed bottom-0 left-0 right-0 z-30 pb-safe">
        <div class="max-w-md mx-auto flex items-center justify-around py-2 px-1">
            <button onclick="changeDay(1)" class="flex flex-col items-center gap-1 p-2 text-slate-400 active:text-emerald-400">
                <i class="fa-solid fa-dumbbell text-lg"></i>
                <span class="text-[10px] font-bold">День A</span>
            </button>
            <button onclick="changeDay(2)" class="flex flex-col items-center gap-1 p-2 text-slate-400 active:text-cyan-400">
                <i class="fa-solid fa-person-swimming text-lg"></i>
                <span class="text-[10px] font-bold">Басейн</span>
            </button>
            <button onclick="changeDay(3)" class="flex flex-col items-center gap-1 p-2 text-slate-400 active:text-indigo-400">
                <i class="fa-solid fa-dumbbell text-lg"></i>
                <span class="text-[10px] font-bold">День B</span>
            </button>
            <button onclick="changeDay(4)" class="flex flex-col items-center gap-1 p-2 text-slate-400 active:text-cyan-400">
                <i class="fa-solid fa-water text-lg"></i>
                <span class="text-[10px] font-bold">Басейн</span>
            </button>
            <button onclick="openTimerModal()" class="flex flex-col items-center gap-1 p-2 text-emerald-400">
                <i class="fa-solid fa-stopwatch text-lg"></i>
                <span class="text-[10px] font-bold">Таймер</span>
            </button>
        </div>
    </nav>

    <!-- Audio Alert Synthesizer for Timer completion -->
    <script>
        // Master Weekly Schedule Structure
        const schedule = [
            {
                id: "pn",
                title: "Понеділок",

                badgeBg: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",

                exercises: [
                    { id: "pn_1", name: "Повноцінний сон (8+ годин)", detail: "Регенерація м'язів та НС", isSwim: false },
                    { name: "Питний режим (2.5-3L води)", detail: "Гідратація суглобів", isSwim: false }
                ]
            },
            {
                id: "vt",
                title: "Вівторок",
                badge: "🏋️ День A (Зал)",
                badgeBg: "bg-blue-500/10 text-blue-400 border-blue-500/20",
                subtitle: "Спина • Плечі • Трицепс • Прес",
                exercises: [
                    { id: "vt_1", name: "1. Тяга верхнього блоку до грудей", detail: "4 підходи × 8–12 повторень", sets: 4, hasLogs: true },
                    { id: "vt_2", name: "2. Тяга штанги/гантелей у нахилі", detail: "3 підходи × 8–10 повторень", sets: 3, hasLogs: true },
                    { id: "vt_3", name: "3. Жим гантелей сидячи", detail: "3 підходи × 10–12 повторень", sets: 3, hasLogs: true },
                    { id: "vt_4", name: "4. Махи гантелями в стороны", detail: "3 підходи × 12–15 повторень", sets: 3, hasLogs: true },
                    { id: "vt_5", name: "5. Французький жим лежачи", detail: "3 підходи × 10–12 повторень", sets: 3, hasLogs: true },
                    { id: "vt_6", name: "6. Планка для кору", detail: "3 підходи × 45–60 секунд", sets: 3, hasLogs: false }
                ]
            },
            {
                id: "sr",
                title: "Середа",
                badge: "🏊 Басейн",
                badgeBg: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20",
                subtitle: "Аеробна витривалість & Відновлення",
                exercises: [
                    { id: "sr_1", name: "1. Легке розминокве плавання", detail: "100–200 метрів у довільному стилі", sets: 1, isSwim: true },
                    { id: "sr_2", name: "2. Основна сесія плавання", detail: "30–45 хвилин у комфортному темпі", sets: 1, isSwim: true },
                    { id: "sr_3", name: "3. Заминка та розтяжка у воді", detail: "5–10 хвилин для розвантаження спини", sets: 1, isSwim: true }
                ]
            },
            {
                id: "cht",
                title: "Четвер",
                badge: "🏋️ День B (Зал)",
                badgeBg: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20",
                subtitle: "Ноги • Груди • Біцепс • Прес",
                exercises: [
                    { id: "cht_1", name: "1. Присідання зі штангою / Жим ногами", detail: "4 підходи × 8–10 повторень", sets: 4, hasLogs: true },
                    { id: "cht_2", name: "2. Румунська тяга з гантелями/штангою", detail: "3 підходи × 8–10 повторень", sets: 3, hasLogs: true },
                    { id: "cht_3", name: "3. Жим гантелей на похилій лаві (30°)", detail: "4 підходи × 8–12 повторень", sets: 4, hasLogs: true },
                    { id: "cht_4", name: "4. Зведення рук у тренажері Метелик", detail: "3 підходи × 12–15 повторень", sets: 3, hasLogs: true },
                    { id: "cht_5", name: "5. Згинання рук з гантелями Молотки", detail: "3 підходи × 10–12 повторень", sets: 3, hasLogs: true },
                    { id: "cht_6", name: "6. Підйом ніг у висі / Скручування", detail: "3 підходи × 12–15 повторень", sets: 3, hasLogs: false }
                ]
            },
            {
                id: "pt",
                title: "П'ятниця",
                badge: "🏊 Басейн",
                badgeBg: "bg-cyan-500/10 text-cyan-400 border-cyan-500/20",
                subtitle: "Кардіо & Розвантаження хребта",
                exercises: [
                    { id: "pt_1", name: "1. Вільний стиль / Кроль", detail: "30–40 хвилин стабільного плавання", sets: 1, isSwim: true },
                    { id: "pt_2", name: "2. Вправи для розвантаження спини", detail: "10 хвилин розслаблення та витяжіння", sets: 1, isSwim: true }
                ]
            },
            {
                id: "sb",
                title: "Субота",
                badge: "🟢 Відпочинок",
                badgeBg: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
                subtitle: "Активне відновлення",
                exercises: [
                    { id: "sb_1", name: "Прогулянка на свіжому повітрі", detail: "40–60 хвилин помірним кроком", isSwim: false },
                    { id: "sb_2", name: "МФР масаж / Легкий стретчинг", detail: "Зняття тонусу з м'язів", isSwim: false }
                ]
            },
            {
                id: "nd",
                title: "Неділя",
                badge: "🟢 Відпочинок",
                badgeBg: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
                subtitle: "Релаксація та підготовка до нового тижня",
                exercises: [
                    { id: "nd_1", name: "Повний розвантажувальний день", detail: "Відпочинок м'язів та суглобів", isSwim: false }
                ]
            }
        ];

        // State Management variables
        let currentDayIdx = 1; // Default to Tuesday (1)
        let activeTimerInterval = null;
        let timerSecondsRemaining = 0;
        let activeLogExerciseId = null;

        document.addEventListener('DOMContentLoaded', () => {
            initSwipeGestures();
            renderApp();
            
            // Set date subtitle
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('header-date').innerText = new Date().toLocaleDateString('uk-UA', options);
        });

        // Trigger vibration feedback on mobile
        function triggerHaptic() {
            if ("vibrate" in navigator) {
                navigator.vibrate(35);
            }
        }

        // Change Current Selected Day
        function changeDay(index, direction = null) {
            triggerHaptic();
            const container = document.getElementById('workout-card-container');
            
            if (direction === 'left') {
                container.classList.remove('slide-left', 'slide-right');
                void container.offsetWidth; // Force reflow
                container.classList.add('slide-left');
            } else if (direction === 'right') {
                container.classList.remove('slide-left', 'slide-right');
                void container.offsetWidth;
                container.classList.add('slide-right');
            }

            currentDayIdx = index;
            renderApp();
        }

        // Render Page State
        function renderApp() {
            const day = schedule[currentDayIdx];
            
            // Render Tabs UI
            for (let i = 0; i < 7; i++) {
                const btn = document.getElementById(`day-btn-${i}`);
                if (i === currentDayIdx) {
                    btn.className = "day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] bg-emerald-500 text-slate-950 font-bold shadow-lg shadow-emerald-500/20 transition-all scale-105";
                    btn.querySelector('span').classList.remove('text-slate-400');
                    btn.querySelector('span').classList.add('text-slate-950');
                } else {
                    btn.className = "day-tab flex-1 py-2 px-3 rounded-xl flex flex-col items-center min-w-[48px] bg-slate-800/80 border border-slate-700/60 text-slate-300 transition-all";
                    btn.querySelector('span').classList.remove('text-slate-950');
                    btn.querySelector('span').classList.add('text-slate-400');
                }
            }

            // Render Header Card Info
            document.getElementById('day-title').innerText = day.title;
            document.getElementById('day-subtitle').innerText = day.subtitle;
            const badgeEl = document.getElementById('day-type-badge');
            badgeEl.innerText = day.badge;
            badgeEl.className = `text-xs font-extrabold px-2.5 py-1 rounded-lg uppercase tracking-wide border ${day.badgeBg}`;

            // Render Exercises
            const listContainer = document.getElementById('workout-card-container');
            let totalTasks = 0;
            let completedTasks = 0;

            listContainer.innerHTML = day.exercises.map((ex, exIdx) => {
                const exId = ex.id || `ex_${currentDayIdx}_${exIdx}`;
                const setKeys = ex.sets ? Array.from({length: ex.sets}, (_, s) => `${exId}_set_${s}`) : [`${exId}_single`];
                
                totalTasks += setKeys.length;
                let exerciseCompletedSets = 0;

                const setsMarkup = setKeys.map((setKey, setIdx) => {
                    const isChecked = localStorage.getItem(setKey) === 'true';
                    if (isChecked) {
                        completedTasks++;
                        exerciseCompletedSets++;
                    }

                    // Logged weight/reps
                    const loggedData = localStorage.getItem(`${setKey}_data`);
                    const logLabel = loggedData ? JSON.parse(loggedData) : null;

                    return `
                        <div class="flex items-center justify-between bg-slate-900/60 border border-slate-800 rounded-xl p-2.5">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleSetCheck('${setKey}')" class="w-7 h-7 rounded-lg border ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-700 bg-slate-800 text-transparent'} flex items-center justify-center transition active:scale-90">
                                    <i class="fa-solid fa-check text-xs font-black"></i>
                                </button>
                                <span class="text-xs font-semibold ${isChecked ? 'line-through text-slate-500' : 'text-slate-200'}">
                                    ${ex.sets ? `Підхід ${setIdx + 1}` : 'Виконано'}
                                </span>
                            </div>

                            ${ex.hasLogs ? `
                                <button onclick="openWeightModal('${setKey}', '${ex.name} - Підхід ${setIdx + 1}')" class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700/80 text-emerald-400 flex items-center gap-1.5 active:scale-95">
                                    <i class="fa-solid fa-pen-to-square text-[10px]"></i>
                                    <span>${logLabel ? `${logLabel.weight}кг × ${logLabel.reps}` : 'Запис'}</span>
                                </button>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                return `
                    <div class="glass-card rounded-2xl p-4 border border-slate-800/80 shadow-md transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                                    ${ex.isSwim ? '<i class="fa-solid fa-water text-cyan-400"></i>' : ''}
                                    ${ex.name}
                                </h3>
                                <p class="text-xs text-slate-400 mt-0.5">${ex.detail}</p>
                            </div>
                        </div>
                        <div class="mt-3 space-y-1.5">
                            ${setsMarkup}
                        </div>
                    </div>
                `;
            }).join('');

            // Calculate Progress Bar
            const percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${percent}%`;
        }

        // Toggle task completion
        function toggleSetCheck(setKey) {
            triggerHaptic();
            const current = localStorage.getItem(setKey) === 'true';
            localStorage.setItem(setKey, (!current).toString());
            
            // Auto start rest timer on checking a set
            if (!current) {
                startTimer(60);
            }
            
            renderApp();
        }

        // Reset All Progress for current day
        function resetCurrentDayProgress() {
            triggerHaptic();
            const day = schedule[currentDayIdx];
            day.exercises.forEach((ex, exIdx) => {
                const exId = ex.id || `ex_${currentDayIdx}_${exIdx}`;
                const setKeys = ex.sets ? Array.from({length: ex.sets}, (_, s) => `${exId}_set_${s}`) : [`${exId}_single`];
                setKeys.forEach(k => {
                    localStorage.removeItem(k);
                    localStorage.removeItem(`${k}_data`);
                });
            });
            renderApp();
        }

        function openTimerModal() {
            triggerHaptic();
            document.getElementById('timer-modal').classList.remove('hidden');
        }

        function closeTimerModal() {
            document.getElementById('timer-modal').classList.add('hidden');
        }

        function startTimer(seconds) {
            triggerHaptic();
            closeTimerModal();
            
            clearInterval(activeTimerInterval);
            timerSecondsRemaining = seconds;

            document.getElementById('active-timer-bar').classList.remove('hidden');
            document.getElementById('timer-badge').classList.remove('hidden');

            updateTimerDisplay();

            activeTimerInterval = setInterval(() => {
                timerSecondsRemaining--;
                updateTimerDisplay();

                if (timerSecondsRemaining <= 0) {
                    clearInterval(activeTimerInterval);
                    playTimerBeep();
                    triggerHaptic();
                    stopTimer();
                }
            }, 1000);
        }

        function addTimerTime(secs) {
            triggerHaptic();
            timerSecondsRemaining += secs;
            updateTimerDisplay();
        }

        function stopTimer() {
            clearInterval(activeTimerInterval);
            document.getElementById('active-timer-bar').classList.add('hidden');
            document.getElementById('timer-badge').classList.add('hidden');
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSecondsRemaining / 60);
            const secs = timerSecondsRemaining % 60;
            document.getElementById('active-timer-countdown').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function playTimerBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch(e) {
                console.log('Audio Context error', e);
            }
        }

        function openWeightModal(setKey, title) {
            triggerHaptic();
            activeLogExerciseId = setKey;
            document.getElementById('weight-modal-title').innerText = title;

            // Pre-fill existing data if present
            const existing = localStorage.getItem(`${setKey}_data`);
            if (existing) {
                const parsed = JSON.parse(existing);
                document.getElementById('input-weight').value = parsed.weight || '';
                document.getElementById('input-reps').value = parsed.reps || '';
            } else {
                document.getElementById('input-weight').value = '';
                document.getElementById('input-reps').value = '';
            }

            document.getElementById('weight-modal').classList.remove('hidden');
        }

        function closeWeightModal() {
            document.getElementById('weight-modal').classList.add('hidden');
        }

        function saveWeightReps() {
            triggerHaptic();
            const weight = document.getElementById('input-weight').value;
            const reps = document.getElementById('input-reps').value;

            if (weight || reps) {
                localStorage.setItem(`${activeLogExerciseId}_data`, JSON.stringify({ weight, reps }));
            }
            closeWeightModal();
            renderApp();
        }

        function initSwipeGestures() {
            const touchZone = document.getElementById('touch-container');
            let startX = 0;
            let startY = 0;

            touchZone.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            touchZone.addEventListener('touchend', (e) => {
                if (!startX || !startY) return;

                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;

                const diffX = startX - endX;
                const diffY = startY - endY;

                // Ensure swipe is horizontal and long enough (>50px)
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        // Swiped Left -> Go to next day
                        if (currentDayIdx < 6) {
                            changeDay(currentDayIdx + 1, 'left');
                        }
                    } else {
                        // Swiped Right -> Go to previous day
                        if (currentDayIdx > 0) {
                            changeDay(currentDayIdx - 1, 'right');
                        }
                    }
                }

                startX = 0;
                startY = 0;
            }, { passive: true });
        }
    </script>
</body>
</html>
